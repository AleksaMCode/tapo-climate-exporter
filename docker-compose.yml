name: tapo-climate

services:
  exporter:
    build:
      context: .
      dockerfile: exporter/Dockerfile
    image: tapo-climate-exporter:local
    restart: unless-stopped
    # Values here override the copy of .env baked into the image, so editing
    # .env only needs `docker compose up -d`, not a rebuild.
    env_file:
      - .env
    environment:
      LISTEN_ADDR: 0.0.0.0:9101
    ports:
      # Only reachable from the server itself, for debugging:
      #   curl http://localhost:9101/metrics
      - "127.0.0.1:9101:9101"

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Rolling window: samples older than this are deleted continuously.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-1y}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Only reachable from the server itself.
      - "127.0.0.1:9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tapo-climate.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Published on all interfaces so the dashboard is reachable from the
      # whole local network: http://<server-ip>:<GRAFANA_PORT>
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
